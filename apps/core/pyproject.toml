[project]
name = "ultron-core"
version = "0.1.0"
description = "A modular personal AI assistant inspired by JARVIS, built incrementally with real-world technologies."
readme = "README.md"
authors = [
    { name = "CadmoNeto", email = "cadmonneto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
